
<div class="register-page">

  <header class="register-header">
    <a class="brand" routerLink="/" aria-label="Convive, inicio">
      ConVive
    </a>

    <a class="explore-link" routerLink="/">
      Explorar
    </a>

    <div class="header-tagline">
      Tu espacio. Tu ritmo. Tu gente.
    </div>
  </header>

  <main class="register-main">

    <section class="register-card">

      <p class="eyebrow">BIENVENIDO A CONVIVE</p>

      <h1>Crea tu cuenta</h1>

      <p class="intro">
        Elige cómo quieres formar parte de la comunidad.
      </p>

      <form #registerForm="ngForm" (ngSubmit)="createAccount()" novalidate>

        <div class="role-selector" aria-label="Tipo de cuenta">

          <button
            type="button"
            class="role-button"
            [class.active]="role === 'tenant'"
            [attr.aria-pressed]="role === 'tenant'"
            (click)="selectRole('tenant')">
            Busco habitación
          </button>

          <button
            type="button"
            class="role-button"
            [class.active]="role === 'landlord'"
            [attr.aria-pressed]="role === 'landlord'"
            (click)="selectRole('landlord')">
            Ofrezco habitación
          </button>

        </div>

        <div class="name-fields">

          <label class="form-field">
            <span>Nombre</span>
            <input
              type="text"
              name="firstName"
              [(ngModel)]="firstName"
              placeholder="Tu nombre"
              autocomplete="given-name"
              required>
          </label>

          <label class="form-field">
            <span>Apellidos</span>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="lastName"
              placeholder="Tus apellidos"
              autocomplete="family-name"
              required>
          </label>

        </div>

        <label class="form-field">
          <span>Correo electrónico</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required
            email>
        </label>

        <label class="form-field">
          <span>Teléfono</span>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="phone"
            placeholder="55 1234 5678"
            autocomplete="tel"
            required>
        </label>

        <label class="form-field password-field">
          <span>Contraseña</span>

          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            minlength="8"
            required>

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </label>

        <label class="terms-checkbox">
          <input
            type="checkbox"
            name="acceptTerms"
            [(ngModel)]="acceptTerms"
            required>

          <span>
            Acepto los
            <a routerLink="/terminos">términos</a>
            y el
            <a routerLink="/privacidad">aviso de privacidad</a>.
          </span>
        </label>

        @if (message) {
          <p
            class="form-message"
            [class.success-message]="message.startsWith('Formulario validado')"
            role="status">
            {{ message }}
          </p>
        }

        <button
          type="submit"
          class="submit-button">
          Crear cuenta
        </button>

        <a class="login-button" routerLink="/login">
          Ya tengo cuenta · Iniciar sesión
        </a>

      </form>

    </section>

  </main>

  <app-site-footer></app-site-footer>

</div>
