<div class="flex min-h-screen flex-col">
  <app-navbar></app-navbar>

  <main class="relative flex-1">
    <div class="pointer-events-none absolute inset-x-0 top-0 -z-10 h-[380px] bg-[radial-gradient(ellipse_50%_50%_at_50%_0%,rgba(204,255,0,0.07),transparent)]"></div>

    <article class="mx-auto w-full max-w-2xl px-6 py-20">
      <p class="enter text-xs font-medium uppercase tracking-wider text-accent [--d:80]">{{ eyebrow() }}</p>
      <h1 class="enter mt-3 text-4xl font-extrabold tracking-tight text-white sm:text-5xl [--d:160]">{{ title() }}</h1>
      <p class="enter mt-4 text-sm text-slate-500 [--d:240]">Última actualización: {{ updated() }}</p>

      <div class="enter mt-12 space-y-10 text-slate-400 [--d:340]">
        <ng-content></ng-content>
      </div>
    </article>
  </main>

  <app-site-footer></app-site-footer>
</div>
